---
- name: Recover an approved incident network route
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate incident recovery controller inputs
      ansible.builtin.assert:
        that:
          - incident_id | default('') | string | trim | length > 0
          - recovery_output_dir | default('') | string | trim | length > 0
          - network_recovery_config is mapping
        fail_msg: >-
          incident_id, recovery_output_dir, and network_recovery_config are required.
      run_once: true

  roles:
    - role: ../roles/network_recovery
      vars:
        network_recovery_interface: "{{ network_recovery_config.interface }}"
        network_recovery_gateway: "{{ network_recovery_config.gateway }}"
        network_recovery_routes: "{{ network_recovery_config.routes }}"
        network_recovery_remove_blackhole_routes: "{{ network_recovery_config.remove_blackhole_routes | default([]) }}"
        network_recovery_execute: true
        network_recovery_allow_default_route_change: "{{ network_recovery_config.allow_default_route_change | default(false) }}"
        network_recovery_allow_ssh_path_change: "{{ network_recovery_config.allow_ssh_path_change | default(false) }}"

  post_tasks:
    - name: Ensure controller recovery output directory exists
      ansible.builtin.file:
        path: "{{ recovery_output_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Save host recovery result on controller
      ansible.builtin.copy:
        content: >-
          {{ {
            'incident_id': incident_id,
            'host': inventory_hostname,
            'generated_at': ansible_date_time.iso8601,
            'recovery': network_recovery_result
          } | to_nice_json }}
        dest: "{{ recovery_output_dir }}/{{ inventory_hostname }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false
