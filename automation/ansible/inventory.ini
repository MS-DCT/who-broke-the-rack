# 실제 SSH 가능한 Management IP/계정 확인 후 수정
# 비밀번호는 파일에 저장하지 말고 ansible -K 또는 Vault 사용

[management]
dca-mgmt01 ansible_host=192.168.100.206 ansible_user=rocky

[targets]
dca-target01 ansible_host=192.168.100.205 ansible_user=ubuntu
dca-target02 ansible_host=192.168.100.207 ansible_user=rocky

[spare]
dca-spare01 ansible_host=192.168.100.208 ansible_user=rocky

[rocky]
dca-mgmt01
dca-target02
dca-spare01

[ubuntu]
dca-target01

[all:vars]
# Set the confirmed SSH account here, in host/group vars, or pass -u at runtime.
# ansible_user=<confirmed_ssh_username>
